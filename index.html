<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101719"><meta name="description" content="A practical planner for FIFO workers: training, food, recovery and your swing."><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>FIFO Reset</title>
<style>
:root{--bg:#101719;--panel:#192326;--panel2:#202d30;--teal:#35d0b0;--muted:#9bb0b0;--text:#f1f7f5;--line:#2d4142;--orange:#ffbf69}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:0 16px 100px}.top{padding:22px 2px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:.08em;font-size:1.03rem}.brand span{color:var(--teal)}.eyebrow{color:var(--teal);font-size:.73rem;letter-spacing:.16em;font-weight:800;text-transform:uppercase}.date{color:var(--muted);font-size:.82rem}.hero{background:linear-gradient(135deg,#203536,#182326 65%);border:1px solid #355150;border-radius:22px;padding:21px;margin:4px 0 18px}.hero h1{font-size:1.8rem;line-height:1.05;margin:8px 0}.hero p{color:#c4d3d0;margin:10px 0 17px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1;min-width:0}.btn{border:0;border-radius:12px;background:var(--teal);color:#071513;font-weight:850;padding:12px 14px}.btn.secondary{background:#2a3b3e;color:var(--text);border:1px solid #3b5253}.btn.ghost{background:transparent;color:var(--teal);border:1px solid #3b6560}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:12px}.card h2,.card h3{margin:0 0 10px}.card h2{font-size:1.08rem}.card h3{font-size:.98rem}.muted{color:var(--muted)}.big{font-size:1.55rem;font-weight:900}.metric{font-size:.78rem;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;margin:21px 2px 11px}.section-head h2{margin:0;font-size:1.1rem}.pill{font-size:.73rem;border-radius:99px;padding:5px 9px;background:#23413c;color:var(--teal);font-weight:800}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#111b1d;border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px}.tabs button{flex:1;max-width:145px;border:0;background:transparent;color:var(--muted);padding:8px 2px;border-radius:12px;font-size:.7rem;font-weight:750}.tabs button .ico{display:block;font-size:1.15rem;margin-bottom:2px}.tabs button.active{background:#203d39;color:var(--teal)}.field{margin:11px 0}.field label{display:block;color:#c0d0ce;font-size:.82rem;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;background:#101a1c;color:var(--text);border:1px solid #385051;border-radius:11px;padding:11px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal)}.range-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.range-row input{width:55%;accent-color:var(--teal)}.range-row strong{min-width:20px;color:var(--teal)}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{border:1px solid #405657;color:#d4e0dd;background:#152022;border-radius:99px;padding:8px 12px;font-size:.84rem}.choice.selected{background:#1d4b43;color:#8ff2d9;border-color:#35bda2}.list{display:grid;gap:8px}.check{display:flex;align-items:center;gap:10px;background:#132022;border:1px solid #2d4142;border-radius:11px;padding:10px}.check input{accent-color:var(--teal);width:18px;height:18px}.check span{flex:1}.small{font-size:.8rem}.workout{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:12px 0}.workout:first-of-type{border-top:0}.workout p{margin:3px 0 0;color:var(--muted);font-size:.8rem}.notice{border-left:3px solid var(--orange);padding:10px 12px;background:#2a2922;color:#f5ddba;border-radius:0 10px 10px 0;font-size:.84rem}.hidden{display:none!important}.empty{padding:22px;text-align:center;color:var(--muted)}.statline{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.statline:last-child{border-bottom:0}.tagline{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tagline span{background:#253538;color:#b7ccca;padding:6px 9px;border-radius:8px;font-size:.77rem}@media(min-width:560px){.hero h1{font-size:2.3rem}.app{padding-left:22px;padding-right:22px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><div class="app">
<header class="top"><div><div class="brand">FIFO <span>RESET</span></div><div class="date" id="today"></div></div><div class="pill">MVP · YOUR SWING</div></header>
<main id="screen"></main>
</div>
<nav class="tabs" aria-label="Main navigation"><button data-tab="home" class="active"><span class="ico">◈</span>Today</button><button data-tab="training"><span class="ico">✦</span>Training</button><button data-tab="food"><span class="ico">◉</span>Food</button><button data-tab="swing"><span class="ico">▦</span>My Swing</button><button data-tab="progress"><span class="ico">↗</span>Progress</button></nav>
<script>
const KEY='fifoReset_v1';let state=load();let tab='home';function fresh(){return{profile:{roster:'8/6',shift:'Day shift',goal:'Build muscle'},days:{},workouts:[],meals:{},swing:{start:'',end:'',notes:''},checks:{},progress:[],exerciseChoices:{}}}function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return fresh()}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){return new Date().toISOString().slice(0,10)}function day(){if(!state.days[today()])state.days[today()]={sleep:7,energy:3,stress:2,soreness:2,motivation:3,water:0,note:''};return state.days[today()]}function label(v,arr){return arr[Number(v)-1]||''}function header(kicker,title,desc=''){return `<div class="section-head"><div><div class="eyebrow">${kicker}</div><h2>${title}</h2>${desc?`<div class="muted small">${desc}</div>`:''}</div></div>`}function card(content){return `<section class="card">${content}</section>`}function slider(name,title,min,max,step=1){let d=day();return `<div class="field"><div class="range-row"><label for="${name}">${title}</label><strong id="${name}v">${d[name]}</strong></div><div class="range-row"><span class="muted small">${name==='sleep'?'Hours':name==='water'?'Glasses':'Low'}</span><input id="${name}" data-day="${name}" type="range" min="${min}" max="${max}" step="${step}" value="${d[name]}"><span class="muted small">${name==='sleep'?'10+':name==='water'?'12':'High'}</span></div></div>`}function choice(name,options,selected){return `<div class="choices">${options.map((x,i)=>`<button class="choice ${selected===i+1?'selected':''}" data-choice="${name}" data-value="${i+1}">${x}</button>`).join('')}</div>`}function home(){let d=day();let energy=Number(d.energy),stress=Number(d.stress),sleep=Number(d.sleep);let advice=energy<=2||sleep<5?'Recovery or a gentle 10–20 minute session. Protect your sleep and don’t force a heavy day.':stress>=4?'Keep it simple: walk, mobility, water and an early wind-down.':energy>=4?'You’re green-lit for your planned session—warm up and adjust to how you feel.':'Aim for a solid 20–30 minute session. Consistency beats perfection.';let done=state.workouts.filter(w=>w.date===today()).length;return `${`<section class="hero"><div class="eyebrow">SHIFT-WORKER PERFORMANCE</div><h1>Reset. Refocus.<br>Get after it.</h1><p>Your swing is demanding enough. Make training, food and recovery easier to manage.</p><div class="row"><button class="btn" data-go="training">Plan today's training ↗</button><button class="btn secondary" data-go="swing">My swing</button></div></section>`}${header('DAILY RESET','How are you travelling?','Quick check-in · takes less than a minute')}${card(`<h3>Sleep</h3>${slider('sleep','Hours slept',0,10,.5)}<h3>Energy</h3>${choice('energy',['Flat','Low','Okay','Good','Fired up'],Number(d.energy))}<div style="height:12px"></div><h3>Stress</h3>${choice('stress',['Easy','Low','Medium','High','Maxed'],Number(d.stress))}<div style="height:12px"></div><h3>Muscle soreness</h3>${choice('soreness',['None','Light','Moderate','Heavy','Rough'],Number(d.soreness))}<div style="height:12px"></div><h3>Motivation</h3>${choice('motivation',['Empty','Low','Some','Ready','All in'],Number(d.motivation))}<div class="field"><label for="note">Anything worth noting?</label><textarea id="note" rows="2" placeholder="Sleep was rough, ankle feels stiff…">${esc(d.note)}</textarea></div><button class="btn" data-action="save-day" style="width:100%">Save today's check-in</button>`)}${card(`<div class="eyebrow">YOUR RESET RECOMMENDATION</div><h3 style="margin-top:7px">${advice}</h3><p class="muted small">Use this as a prompt, not a diagnosis. If you’re unwell, injured or unsafe to train, choose rest and appropriate professional advice.</p>`)}<div class="grid">${card(`<div class="metric">WORKOUTS TODAY</div><div class="big">${done}</div><div class="muted small">Logged sessions</div>`)}${card(`<div class="metric">WATER TRACKER</div><div class="big">${d.water} / 8</div><button class="btn secondary" data-action="water">+ Glass</button>`)} </div>${header('QUICK WINS','Small things count')}${card(`<div class="list">${['Get a water bottle filled','Eat a protein source with your next meal','Take 5 minutes for mobility','Set a wind-down time'].map((x,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${state.checks[today()]?.[i]?'checked':''}><span>${x}</span></label>`).join('')}</div>`)}`}
const plans=[{name:'20 min · Minimum effective',desc:'When energy is low or time is tight',moves:['3 min warm-up','Goblet squat or leg press · 3 × 8–12','Chest press or push-ups · 3 × 8–12','Cable row · 3 × 10–12','Leave one or two reps in reserve']},{name:'30 min · Full body',desc:'A reliable camp-gym session',moves:['4 min warm-up','Leg press · 3 × 8–12','Dumbbell bench · 3 × 8–12','Lat pulldown · 3 × 8–12','Romanian deadlift · 2 × 8–10','Plank · 2 sets']},{name:'45 min · Strength & size',desc:'For a good-energy day',moves:['5 min warm-up','Main lift · 4 × 5–8','Push movement · 3 × 8–12','Pull movement · 3 × 8–12','Leg accessory · 3 × 10–15','Arms or core · 2–3 sets']}];const exerciseOptions=[
[
['3 min warm-up'],
['Goblet squat','Leg press','Box squat to comfortable depth','Seated leg extension'],
['Chest press machine','Push-ups','Dumbbell bench press','Incline chest press machine'],
['Cable row','Seated row machine','Chest-supported dumbbell row','Resistance-band row'],
['Leave one or two reps in reserve']
],
[
['4 min warm-up'],
['Leg press','Goblet squat','Box squat to comfortable depth','Seated leg extension'],
['Dumbbell bench press','Chest press machine','Push-ups','Incline chest press machine'],
['Lat pulldown','Assisted pull-up','Resistance-band pulldown'],
['Romanian deadlift','Dumbbell hip hinge','Seated hamstring curl','Cable pull-through'],
['Plank','Dead bug','Pallof press','Bird dog']
],
[
['5 min warm-up'],
['Main lift: leg press','Main lift: dumbbell bench press','Main lift: chest-supported row','Main lift: Romanian deadlift'],
['Push: dumbbell bench press','Push: chest press machine','Push: push-ups','Push: shoulder press machine'],
['Pull: lat pulldown','Pull: cable row','Pull: chest-supported row','Pull: assisted pull-up'],
['Leg accessory: leg extension','Leg accessory: hamstring curl','Leg accessory: split squat to comfortable depth','Leg accessory: calf raise'],
['Arms: dumbbell curl','Arms: cable triceps pressdown','Core: plank','Core: dead bug']
]
];
function training(){
return `${header('TRAINING','Pick the session that fits','Choose an exercise from each dropdown to suit your gym equipment and how you feel')}${plans.map((p,i)=>card(`<div class="eyebrow">${i===0?'LOW-FRICTION':i===1?'STANDARD':'FULL SESSION'}</div><h3>${p.name}</h3><p class="muted small">${p.desc}</p><div class="list">${p.moves.map((m,j)=>{let opts=exerciseOptions[i][j]||[m];let isExercise=opts.length>1;let key=`${i}-${j}`;let chosen=state.exerciseChoices?.[key]||opts[0];return isExercise?`<div class="field"><label for="exercise-${key}">${m.includes('·')?esc(m.split('·')[1].trim()):'Choose exercise'}</label><select id="exercise-${key}" data-exercise-choice="${key}">${opts.map(o=>`<option value="${esc(o)}" ${chosen===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`:`<div class="check"><span>${esc(m)}</span></div>`}).join('')}</div><button class="btn" style="width:100%;margin-top:12px" data-log="${i}">Log this workout</button>`)).join('')}${card(`<h3>Quick workout log</h3><div class="field"><label for="worknote">Session notes</label><textarea id="worknote" rows="2" placeholder="Loads, reps, how it felt…"></textarea></div><p class="muted small">Your exercise selections stay saved on this device. Logging a template adds a dated session to Progress.</p>`)}`}
function food(){let meals=state.meals[today()]||{breakfast:'',lunch:'',dinner:'',snacks:'',water:0};return `${header('FUEL','Make camp food work for you','Aim for repeatable habits, not perfect eating')}${card(`<h3>Today's meal plan</h3>${[['breakfast','Breakfast'],['lunch','Lunch'],['dinner','Dinner'],['snacks','Snacks / protein option']].map(([k,t])=>`<div class="field"><label for="meal-${k}">${t}</label><input id="meal-${k}" data-meal="${k}" value="${esc(meals[k])}" placeholder="e.g. eggs, yoghurt, fruit"></div>`).join('')}<button class="btn" data-action="save-meals" style="width:100%">Save meal plan</button>`)}${card(`<h3>Camp mess: simple plate guide</h3><div class="grid"><div><div class="big">½</div><strong>Veg / salad</strong><p class="muted small">Colour and fibre</p></div><div><div class="big">¼</div><strong>Protein</strong><p class="muted small">Meat, eggs, tofu or legumes</p></div><div><div class="big">¼</div><strong>Carbs</strong><p class="muted small">Rice, potato, pasta or bread</p></div></div><p class="muted small">Adjust portions to your appetite, workload and goals. No need to be perfect every meal.</p>`)}${card(`<h3>Shopping / bag checklist</h3><div class="list">${['Protein powder or shelf-stable protein if useful','Fruit you will actually eat','Yoghurt or suitable alternative','Water bottle','Easy backup snack for long shifts'].map((x,i)=>`<label class="check"><input type="checkbox" data-foodcheck="${i}" ${state.checks['food'+today()]?.[i]?'checked':''}><span>${x}</span></label>`).join('')}</div>`)}${card(`<div class="notice">Hydration needs vary with heat, sweat and medical conditions. Follow site guidance, and don't force excessive water.</div>`)}`}
function swing(){return `${header('ROSTER','My swing','Set the dates and the shift pattern you are working')}${card(`<div class="field"><label for="start">Swing start date</label><input id="start" type="date" value="${esc(state.swing.start)}"></div><div class="field"><label for="end">Swing end date</label><input id="end" type="date" value="${esc(state.swing.end)}"></div><div class="field"><label for="shift">Current shift</label><select id="shift"><option ${state.profile.shift==='Day shift'?'selected':''}>Day shift</option><option ${state.profile.shift==='Night shift'?'selected':''}>Night shift</option><option ${state.profile.shift==='Break / home time'?'selected':''}>Break / home time</option></select></div><div class="field"><label for="roster">Roster pattern</label><input id="roster" value="${esc(state.profile.roster)}" placeholder="e.g. 8/6"></div><div class="field"><label for="swingnotes">Swing notes</label><textarea id="swingnotes" rows="3" placeholder="Travel, gym access, meal prep…">${esc(state.swing.notes)}</textarea></div><button class="btn" data-action="save-swing" style="width:100%">Save swing details</button>`)}${card(`<h3>Pre-swing checklist</h3><div class="list">${['Pack training shoes and gear','Plan 2–3 go-to workouts','Pack work-safe snacks','Set a sleep routine for shift times','Sort home responsibilities before travel'].map((x,i)=>`<label class="check"><input type="checkbox" data-swingcheck="${i}" ${state.checks['swing']?.[i]?'checked':''}><span>${x}</span></label>`).join('')}</div>`)}${card(`<h3>Home-time reset</h3><p class="muted small">Give yourself a little space to decompress, reconnect with your people, move your body and prepare for the next swing. You don't have to catch up on everything in one day.</p>`)}`}
function progress(){let all=state.workouts.slice().reverse();let d=day();return `${header('PROGRESS','Proof you are showing up','Progress is more than the number on the scales')}${card(`<div class="grid"><div><div class="metric">TOTAL SESSIONS</div><div class="big">${state.workouts.length}</div></div><div><div class="metric">CHECK-IN DAYS</div><div class="big">${Object.keys(state.days).length}</div></div><div><div class="metric">CURRENT SLEEP</div><div class="big">${d.sleep}h</div></div></div>`)}${card(`<h3>Body / performance check-in</h3><div class="field"><label for="weight">Weight (optional, kg)</label><input id="weight" type="number" inputmode="decimal" placeholder="e.g. 88.5"></div><div class="field"><label for="waist">Waist (optional, cm)</label><input id="waist" type="number" inputmode="decimal" placeholder="e.g. 84"></div><div class="field"><label for="prnote">Strength, energy or wins</label><textarea id="prnote" rows="2" placeholder="Better sleep, stronger sets, consistent meals…"></textarea></div><button class="btn" data-action="save-progress" style="width:100%">Save progress check-in</button>`)}${header('TRAINING HISTORY','Recent sessions')}${all.length?card(all.map(w=>`<div class="workout"><div><strong>${esc(w.name)}</strong><p>${esc(w.date)} · ${esc(w.note||'No notes added')}</p></div><span class="pill">Logged</span></div>`).join('')):card(`<div class="empty">No workouts logged yet. Your first session counts—start where you are.</div>`)}${state.progress.length?`${header('CHECK-IN HISTORY','Past check-ins')}${card(state.progress.slice().reverse().map(p=>`<div class="workout"><div><strong>${esc(p.date)}</strong><p>${p.weight?esc(p.weight)+' kg':''}${p.waist?' · '+esc(p.waist)+' cm':''} ${esc(p.note||'')}</p></div></div>`).join(''))}`:''}${card(`<button class="btn secondary" data-action="export" style="width:100%">Export my data</button><p class="muted small">Keep a backup somewhere safe. Entries currently stay in this browser on this device.</p>`)}`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let f={home,training,food,swing,progress}[tab];document.getElementById('screen').innerHTML=f();document.getElementById('today').textContent=new Date().toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});document.querySelectorAll('[data-day]').forEach(el=>el.addEventListener('input',()=>{day()[el.dataset.day]=Number(el.value);let v=document.getElementById(el.id+'v');if(v)v.textContent=el.value;save()}));}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.go){tab=b.dataset.go;render();return}if(b.dataset.choice){day()[b.dataset.choice]=Number(b.dataset.value);save();render();return}if(b.dataset.log!==undefined){let n=Number(b.dataset.log);let selected=plans[n].moves.map((m,j)=>{let opts=exerciseOptions[n][j]||[m];return opts.length>1?(state.exerciseChoices?.[`${n}-${j}`]||opts[0]):m});state.workouts.push({date:today(),name:plans[n].name,note:([document.getElementById('worknote')?.value||'',`Exercises: ${selected.join('; ')}`].filter(Boolean)).join(' | ')});save();alert('Workout logged, bro. One session in the bank.');tab='progress';render();return}if(b.dataset.action==='save-day'){day().note=document.getElementById('note')?.value||'';save();alert('Check-in saved. Small steps still count.');render()}else if(b.dataset.action==='water'){day().water=Math.min(20,Number(day().water)+1);save();render()}else if(b.dataset.action==='save-meals'){let m={};document.querySelectorAll('[data-meal]').forEach(el=>m[el.dataset.meal]=el.value);state.meals[today()]=m;save();alert('Meal plan saved.');render()}else if(b.dataset.action==='save-swing'){state.swing.start=document.getElementById('start').value;state.swing.end=document.getElementById('end').value;state.swing.notes=document.getElementById('swingnotes').value;state.profile.shift=document.getElementById('shift').value;state.profile.roster=document.getElementById('roster').value;save();alert('Swing details saved.');render()}else if(b.dataset.action==='save-progress'){state.progress.push({date:today(),weight:document.getElementById('weight').value,waist:document.getElementById('waist').value,note:document.getElementById('prnote').value});save();alert('Progress check-in saved.');render()}else if(b.dataset.action==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='fifo-reset-backup.json';a.click();URL.revokeObjectURL(url)}});
document.addEventListener('change',e=>{let el=e.target;if(el.dataset.exerciseChoice!==undefined){state.exerciseChoices??={};state.exerciseChoices[el.dataset.exerciseChoice]=el.value;save();return}if(el.dataset.check!==undefined){state.checks[today()]??={};state.checks[today()][el.dataset.check]=el.checked;save()}if(el.dataset.foodcheck!==undefined){state.checks['food'+today()]??={};state.checks['food'+today()][el.dataset.foodcheck]=el.checked;save()}if(el.dataset.swingcheck!==undefined){state.checks.swing??={};state.checks.swing[el.dataset.swingcheck]=el.checked;save()}});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
